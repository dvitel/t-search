# conda env create -f environment2.yml --prefix ./t-search-env

name: t-search-env
channels:
  - pytorch 
  - nvidia
  - defaults
  - conda-forge
dependencies:
  - python==3.10.13

  # - pytorch=2.5.1
  # - pytorch-cuda=12.4
  - pytorch=1.13.1
  - cudatoolkit=11.3

  - numpy=1.23.5
  - pandas=1.5.3
  - scikit-learn=1.1.3
  - scipy=1.9.3
  - sympy=1.14.0
  # only for LLMM operator, if you do not plan to use LLM prompting, ignore installing this
  - jinja2==3.1.6
  - openai==2.6.1
  - google-genai==1.43.0

  # -- deve dependencies 
  - seaborn
  - matplotlib
  - pytest
  - black
  - isort
  - mypy
  - flake8